# py-frame configuration
#
# [schedule]
# Auto-scheduling window: the screen goes black and the slideshow pauses
# during this window, then resumes automatically when it ends. Times are
# 24-hour HH:MM. A window that wraps past midnight (e.g. 22:00 -> 07:00)
# is supported.

[schedule]
start = 22:00
end = 7:00

# [display]
# shuffle = true fully randomizes photo display order at startup.
# shuffle = false keeps the list's original order, starting from a random
# point and wrapping around. Applied once when the app starts (no longer
# toggleable from the web UI); restart the service to pick up a change.

[display]
shuffle = true
